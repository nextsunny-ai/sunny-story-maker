name: Build Windows EXE

# SUNNY Story Maker — Windows .exe / .msi 자동 빌드 (build-mac.yml 패턴, Windows runner)
# 트리거: 수동 실행(workflow_dispatch) 또는 = "win-build-*" 태그 push
# 결과: .exe / .msi artifact 업로드 (= 다운받아서 _private_downloads/ 박음)

on:
  workflow_dispatch:
  push:
    tags:
      - "win-build-*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri (Windows .exe / .msi)
        run: npm run tauri:build
        env:
          # 자동 업데이터 서명 키 (= build-mac.yml과 같은 GitHub Secrets)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List build output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle/nsis/ -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse src-tauri/target/release/bundle/msi/ -ErrorAction SilentlyContinue

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunny-story-maker-windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: warn
          retention-days: 14
